name: devflow

services:
  gitea:
    # Pin exact stable versions. Do not use floating tags such as latest or v3;
    # unexpected upgrades can introduce migrations or behavior changes.
    image: docker.gitea.com/gitea:1.26.2
    container_name: gitea
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__server__DOMAIN: localhost
      GITEA__server__ROOT_URL: http://localhost:5200/
      GITEA__server__SSH_DOMAIN: localhost
      GITEA__server__SSH_PORT: "5222"
      GITEA__webhook__ALLOWED_HOST_LIST: external,loopback,private,woodpecker-server
      GITEA__ui__DEFAULT_THEME: gitea-auto
    ports:
      # DevFlow reserves the 52xx host port range.
      - "5200:3000"
      - "5222:22"
    volumes:
      # Persistent Git server state. This is an external volume on purpose:
      # never let Compose own it, because `docker compose down -v` would
      # otherwise delete repositories, users, issues, packages, and config.
      - gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

  woodpecker-server:
    # Pin exact stable versions. Keep server and agent on the same version.
    image: woodpeckerci/woodpecker-server:v3.15.0
    container_name: woodpecker-server
    restart: unless-stopped
    depends_on:
      - gitea
    ports:
      # DevFlow reserves the 52xx host port range.
      - "5201:8000"
    environment:
      WOODPECKER_OPEN: "true"
      WOODPECKER_ADMIN: ${WOODPECKER_ADMIN:-}
      WOODPECKER_HOST: ${WOODPECKER_HOST:-http://localhost:5201}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
      WOODPECKER_GITEA: "true"
      WOODPECKER_GITEA_URL: ${WOODPECKER_GITEA_URL:-http://gitea:3000}
      WOODPECKER_GITEA_CLIENT: ${WOODPECKER_GITEA_CLIENT}
      WOODPECKER_GITEA_SECRET: ${WOODPECKER_GITEA_SECRET}
      WOODPECKER_EXPERT_FORGE_OAUTH_HOST: ${WOODPECKER_EXPERT_FORGE_OAUTH_HOST:-http://localhost:5200}
      WOODPECKER_EXPERT_WEBHOOK_HOST: ${WOODPECKER_EXPERT_WEBHOOK_HOST:-http://woodpecker-server:8000}
    volumes:
      # Persistent Woodpecker server state, including SQLite metadata.
      # External for the same reason as gitea-data: protect it from
      # accidental removal via `docker compose down -v`.
      - woodpecker-server-data:/var/lib/woodpecker/

  woodpecker-agent:
    # Pin exact stable versions. Keep server and agent on the same version.
    image: woodpeckerci/woodpecker-agent:v3.15.0
    container_name: woodpecker-agent
    command: agent
    restart: unless-stopped
    depends_on:
      - woodpecker-server
    environment:
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
      WOODPECKER_BACKEND: docker
      WOODPECKER_BACKEND_DOCKER_NETWORK: devflow_default
    volumes:
      # Agent registration/config state. Keep external so agent identity
      # survives Compose project recreation and `docker compose down -v`.
      - woodpecker-agent-config:/etc/woodpecker
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  # External volumes must be created before first `docker compose up`.
  # Run `./scripts/create-external-volumes.sh`, or create them manually:
  #   docker volume create devflow_gitea-data
  #   docker volume create devflow_woodpecker-server-data
  #   docker volume create devflow_woodpecker-agent-config
  gitea-data:
    name: devflow_gitea-data
    external: true
  woodpecker-server-data:
    name: devflow_woodpecker-server-data
    external: true
  woodpecker-agent-config:
    name: devflow_woodpecker-agent-config
    external: true
